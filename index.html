<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash of Nouns - PvP Duelo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- TOP HUD -->
        <div id="top-hud">
            <!-- RED CLAN (P1) -->
            <div class="hud-clan red-clan">
                <span class="clan-title">RED CLAN (P1)</span>
                <div class="hp-bar-outer"><div id="p1-hp" class="hp-bar-inner"></div></div>
            </div>

            <!-- TIMER Y NIVEL -->
            <div id="timer-box">
                <div id="timer-text">2:00</div>
                <select id="cefr-select" onchange="changeLevel()">
                    <option value="A1">A1 - Beginner</option>
                    <option value="A2">A2 - Elementary</option>
                    <option value="B1">B1 - Intermediate</option>
                </select>
            </div>

            <!-- BLUE CLAN (P2) -->
            <div class="hud-clan blue-clan">
                <button id="music-btn" onclick="toggleMusic()">music ON/OFF</button>
                <span class="clan-title">BLUE CLAN (P2)</span>
                <div class="hp-bar-outer"><div id="p2-hp" class="hp-bar-inner"></div></div>
            </div>
        </div>

        <!-- CAMPO DE BATALLA (Dibujos Canvas) -->
        <div id="canvas-container">
            <canvas id="battleCanvas"></canvas>
        </div>

        <!-- PANTALLA DIVIDIDA DE PREGUNTAS (PVP) -->
        <div id="split-controls">
            <!-- JUGADOR 1 (Izquierda) -->
            <div class="player-panel p1-panel">
                <div class="panel-header">RED CLAN</div>
                <div id="p1-category" class="category-tag">CATEGORY</div>
                <div id="p1-question" class="question-box">Cargando...</div>
                <div id="p1-options" class="options-grid"></div>
            </div>

            <!-- LÍNEA DIVISORIA CENTRAL -->
            <div class="center-divider"></div>

            <!-- JUGADOR 2 (Derecha) -->
            <div class="player-panel p2-panel">
                <div class="panel-header">BLUE CLAN</div>
                <div id="p2-category" class="category-tag">CATEGORY</div>
                <div id="p2-question" class="question-box">Cargando...</div>
                <div id="p2-options" class="options-grid"></div>
            </div>
        </div>
    </div>

    <!-- MODAL VICTORIA -->
    <div id="game-over-modal" class="modal hidden">
        <h1 id="winner-text">¡GANA JUGADOR!</h1>
        <button class="btn-restart" onclick="restartGame()">¡OTRA VEZ!</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
