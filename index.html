<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clash of Nouns - Team VS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0b0c10;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top HUD / Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 30px;
      background: rgba(20, 22, 30, 0.9);
      border-bottom: 2px solid #1f2833;
      z-index: 10;
    }

    .team-hud {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 35%;
    }

    .team-hud.blue {
      flex-direction: row-reverse;
    }

    .team-name {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .red-text { color: #ff3366; text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
    .blue-text { color: #00d2ff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }

    .hp-bar-outer {
      flex-grow: 1;
      height: 22px;
      background: #1a1a24;
      border-radius: 11px;
      overflow: hidden;
      border: 2px solid #333;
      position: relative;
    }

    .hp-bar-inner {
      height: 100%;
      width: 100%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .red-hp { background: linear-gradient(90deg, #ff3366, #ff6b81); }
    .blue-hp { background: linear-gradient(90deg, #0072ff, #00d2ff); }

    /* Center Timer */
    .timer-box {
      border: 3px solid #ff3366;
      border-radius: 8px;
      padding: 6px 20px;
      background: #12131c;
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
    }

    .timer-text {
      font-size: 2rem;
      font-weight: 800;
      color: #ff3366;
      font-family: monospace;
    }

    /* Battlefield Canvas */
    #battlefield {
      flex-grow: 1;
      width: 100%;
      background: radial-gradient(circle at center, #1a1c29 0%, #0d0e15 100%);
      display: block;
    }

    /* Bottom Control / Questions Section */
    .quiz-container {
      display: flex;
      height: 240px;
      border-top: 2px solid #222533;
      background: #0f1017;
      position: relative;
    }

    .quiz-side {
      flex: 1;
      padding: 15px 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .quiz-side.red-side {
      border-right: 2px solid rgba(255, 255, 255, 0.1);
    }

    .question-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #aaa;
      margin-bottom: 6px;
    }

    .question-card {
      background: #181a26;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 1.15rem;
      font-weight: 600;
      min-height: 50px;
      display: flex;
      align-items: center;
      border: 1px solid #2a2d3d;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .option-btn {
      background: #1e2235;
      border: 2px solid #2e344d;
      color: #fff;
      padding: 12px 8px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .option-btn:hover {
      transform: translateY(-2px);
    }

    .red-side .option-btn:hover { border-color: #ff3366; background: rgba(255, 51, 102, 0.15); }
    .blue-side .option-btn:hover { border-color: #00d2ff; background: rgba(0, 210, 255, 0.15); }

    /* Game Over Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-content {
      background: #161824;
      border: 3px solid #333;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
    }

    .modal-title { font-size: 2.5rem; margin-bottom: 15px; }
    .restart-btn {
      margin-top: 20px;
      padding: 12px 30px;
      background: #ff3366;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top HUD -->
  <header>
    <div class="team-hud red">
      <span class="team-name red-text">RED</span>
      <div class="hp-bar-outer"><div id="red-hp" class="hp-bar-inner red-hp"></div></div>
    </div>
    
    <div class="timer-box">
      <div id="timer" class="timer-text">2:00</div>
    </div>
    
    <div class="team-hud blue">
      <span class="team-name blue-text">BLUE</span>
      <div class="hp-bar-outer"><div id="blue-hp" class="hp-bar-inner blue-hp"></div></div>
    </div>
  </header>

  <!-- Animated Canvas -->
  <canvas id="battlefield"></canvas>

  <!-- Bottom Quiz Interface -->
  <div class="quiz-container">
    <!-- Red Team Question -->
    <div class="quiz-side red-side">
      <div class="question-title red-text">Red Team Question:</div>
      <div class="question-card" id="red-q-text">Loading...</div>
      <div class="options-grid" id="red-options"></div>
    </div>

    <!-- Blue Team Question -->
    <div class="quiz-side blue-side">
      <div class="question-title blue-text">Blue Team Question:</div>
      <div class="question-card" id="blue-q-text">Loading...</div>
      <div class="options-grid" id="blue-options"></div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div class="modal" id="game-over-modal">
    <div class="modal-content">
      <div class="modal-title" id="winner-text">RED WINS!</div>
      <button class="restart-btn" onclick="resetGame()">Play Again</button>
    </div>
  </div>

  <script>
    // --- Noun Questions Data ---
    const nounQuestions = [
      { q: "Which word is a Proper Noun?", options: ["city", "London", "building"], answer: "London" },
      { q: "Identify the Abstract Noun:", options: ["Happiness", "Apple", "Teacher"], answer: "Happiness" },
      { q: "Select the Collective Noun:", options: ["Flock", "Bird", "Feather"], answer: "Flock" },
      { q: "Which noun is plural?", options: ["Child", "Children", "Childs"], answer: "Children" },
      { q: "Find the Countable Noun:", options: ["Water", "Coin", "Music"], answer: "Coin" },
      { q: "Which of these is a Uncountable Noun?", options: ["Rice", "Plate", "Spoon"], answer: "Rice" },
      { q: "Identify the Compound Noun:", options: ["Sunlight", "Sunny", "Sun"], answer: "Sunlight" }
    ];

    // --- Game State ---
    let redHealth = 100;
    let blueHealth = 100;
    let timeRemaining = 120; // 2 minutes
    let timerInterval = null;
    let currentRedQ = null;
    let currentBlueQ = null;

    // Canvas Setup
    const canvas = document.getElementById("battlefield");
    const ctx = canvas.getContext("2d");
    let arrows = [];
    let particles = [];
    let floatingTexts = [];
    let screenShake = 0;

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Arrow & Animation Engine ---
    class Arrow {
      constructor(startX, startY, targetX, targetY, color) {
        this.startX = startX;
        this.startY = startY;
        this.targetX = targetX;
        this.targetY = targetY;
        this.color = color;
        this.progress = 0;
        this.speed = 0.025 + Math.random() * 0.008;
        this.arcHeight = 60 + Math.random() * 80;
        
        this.x = startX;
        this.y = startY;
        this.prevX = startX;
        this.prevY = startY;
      }

      update() {
        this.prevX = this.x;
        this.prevY = this.y;
        this.progress += this.speed;

        // Quadratic Bezier Parabolic Curve
        const t = this.progress;
        this.x = (1 - t) * this.startX + t * this.targetX;
        const linearY = (1 - t) * this.startY + t * this.targetY;
        this.y = linearY - Math.sin(t * Math.PI) * this.arcHeight;

        return this.progress >= 1;
      }

      draw() {
        const dx = this.x - this.prevX;
        const dy = this.y - this.prevY;
        const angle = Math.atan2(dy, dx);

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(angle);

        // Arrow Body
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(10, 0);
        ctx.stroke();

        // Arrow Head
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.moveTo(10, -4);
        ctx.lineTo(16, 0);
        ctx.lineTo(10, 4);
        ctx.fill();

        ctx.restore();
      }
    }

    function createHitParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 1.0,
          color
        });
      }
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, life: 1.0, color });
    }

    // --- Canvas Render Loop ---
    function animate() {
      ctx.save();

      // Screen Shake
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.85;
        if (screenShake < 0.5) screenShake = 0;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const midX = canvas.width / 2;
      const groundY = canvas.height - 30;

      // Draw Center Line (Divider)
      ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
      ctx.setLineDash([8, 8]);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(midX, 0);
      ctx.lineTo(midX, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Stick Figures (Red Team Left, Blue Team Right)
      drawStickTeam(canvas.width * 0.15, groundY, 4, "#ff3366", true);
      drawStickTeam(canvas.width * 0.85, groundY, 4, "#00d2ff", false);

      // Update & Render Arrows
      for (let i = arrows.length - 1; i >= 0; i--) {
        const arrow = arrows[i];
        const arrived = arrow.update();
        arrow.draw();

        if (arrived) {
          createHitParticles(arrow.targetX, arrow.targetY, arrow.color);
          addFloatingText("-10 HP", arrow.targetX, arrow.targetY - 10, arrow.color);
          screenShake = 6;
          arrows.splice(i, 1);
        }
      }

      // Render Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        if (p.life <= 0) particles.splice(i, 1);
      }

      // Render Floating Combat Text
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 1;
        ft.life -= 0.02;
        ctx.fillStyle = ft.color;
        ctx.font = "bold 18px Segoe UI";
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.fillText(ft.text, ft.x - 20, ft.y);
        ctx.globalAlpha = 1.0;

        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(animate);
    }

    function drawStickTeam(startX, groundY, count, color, isFacingRight) {
      const spacing = 40;
      for (let i = 0; i < count; i++) {
        const x = isFacingRight ? startX - i * spacing : startX + i * spacing;
        const y = groundY;

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;

        // Head
        ctx.beginPath();
        ctx.arc(x, y - 45, 8, 0, Math.PI * 2);
        ctx.stroke();

        // Body
        ctx.beginPath();
        ctx.moveTo(x, y - 37);
        ctx.lineTo(x, y - 18);
        ctx.stroke();

        // Legs
        ctx.beginPath();
        ctx.moveTo(x, y - 18);
        ctx.lineTo(x - 8, y);
        ctx.moveTo(x, y - 18);
        ctx.lineTo(x + 8, y);
        ctx.stroke();

        // Arms (Holding Bow)
        const armDir = isFacingRight ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(x, y - 30);
        ctx.lineTo(x + 10 * armDir, y - 25);
        ctx.stroke();
      }
    }

    // --- Attack Actions ---
    function triggerAttack(attacker) {
      const isRed = attacker === 'red';
      const count = 5; // Arrow Volley Count

      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const startX = isRed ? canvas.width * 0.15 : canvas.width * 0.85;
          const startY = canvas.height - 60 - Math.random() * 20;
          const targetX = isRed ? canvas.width * 0.85 : canvas.width * 0.15;
          const targetY = canvas.height - 40 - Math.random() * 20;
          const color = isRed ? '#ff3366' : '#00d2ff';

          arrows.push(new Arrow(startX, startY, targetX, targetY, color));
        }, i * 80);
      }

      // Damage Logic
      if (isRed) {
        blueHealth = Math.max(0, blueHealth - 10);
        document.getElementById("blue-hp").style.width = blueHealth + "%";
      } else {
        redHealth = Math.max(0, redHealth - 10);
        document.getElementById("red-hp").style.width = redHealth + "%";
      }

      checkWinCondition();
    }

    // --- Quiz Logic ---
    function getRandomQuestion() {
      return nounQuestions[Math.floor(Math.random() * nounQuestions.length)];
    }

    function loadQuestion(team) {
      const q = getRandomQuestion();
      if (team === 'red') {
        currentRedQ = q;
        document.getElementById("red-q-text").innerText = q.q;
        const container = document.getElementById("red-options");
        container.innerHTML = "";
        q.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = opt;
          btn.onclick = () => answerQuestion('red', opt);
          container.appendChild(btn);
        });
      } else {
        currentBlueQ = q;
        document.getElementById("blue-q-text").innerText = q.q;
        const container = document.getElementById("blue-options");
        container.innerHTML = "";
        q.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = opt;
          btn.onclick = () => answerQuestion('blue', opt);
          container.appendChild(btn);
        });
      }
    }

    function answerQuestion(team, selected) {
      const currentQ = team === 'red' ? currentRedQ : currentBlueQ;
      if (selected === currentQ.answer) {
        triggerAttack(team);
      }
      loadQuestion(team);
    }

    // --- Game Timer & Rules ---
    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById("timer").innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

        if (timeRemaining <= 0) {
          endGame();
        }
      }, 1000);
    }

    function checkWinCondition() {
      if (redHealth <= 0 || blueHealth <= 0) {
        endGame();
      }
    }

    function endGame() {
      clearInterval(timerInterval);
      const modal = document.getElementById("game-over-modal");
      const title = document.getElementById("winner-text");

      if (redHealth > blueHealth) {
        title.innerText = "RED TEAM WINS!";
        title.className = "modal-title red-text";
      } else if (blueHealth > redHealth) {
        title.innerText = "BLUE TEAM WINS!";
        title.className = "modal-title blue-text";
      } else {
        title.innerText = "IT'S A DRAW!";
        title.className = "modal-title";
      }

      modal.style.display = "flex";
    }

    function resetGame() {
      redHealth = 100;
      blueHealth = 100;
      timeRemaining = 120;
      document.getElementById("red-hp").style.width = "100%";
      document.getElementById("blue-hp").style.width = "100%";
      document.getElementById("game-over-modal").style.display = "none";

      loadQuestion('red');
      loadQuestion('blue');
      clearInterval(timerInterval);
      startTimer();
    }

    // Initialize Game
    loadQuestion('red');
    loadQuestion('blue');
    startTimer();
    animate();
  </script>
</body>
</html>
