<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EFL Grammar Clash 1v1</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Canvas de fondo 3D -->
  <div id="canvas-container"></div>

  <!-- Capa HUD e Interfaz de Juego -->
  <div id="ui-layer">
    
    <!-- BARRA SUPERIOR DE SALUD Y NIVEL -->
    <header id="hud-top">
      <div class="player-card p1">
        <div class="avatar">🧙‍♂️</div>
        <div class="info">
          <span class="name">HERO (P1)</span>
          <div class="hp-bar-outer"><div id="p1-hp" class="hp-bar-inner" style="width: 100%;"></div></div>
        </div>
      </div>

      <div id="level-badge">
        <label for="level-select">CEFR LEVEL</label>
        <select id="level-select" onchange="changeLevel()">
          <option value="A1">A1 - Beginner</option>
          <option value="A2">A2 - Elementary</option>
          <option value="B1" selected>B1 - Intermediate</option>
          <option value="B2">B2 - Upper-Int</option>
          <option value="C1">C1 - Advanced</option>
        </select>
        <div id="combo-tag">COMBO: <span id="combo-count">0</span>x</div>
      </div>

      <div class="player-card p2">
        <div class="info align-right">
          <span class="name">BOSS (P2)</span>
          <div class="hp-bar-outer"><div id="p2-hp" class="hp-bar-inner" style="width: 100%;"></div></div>
        </div>
        <div class="avatar">🧌</div>
      </div>
    </header>

    <!-- TARJETA DE PREGUNTA BATTLE CARD -->
    <main id="quiz-container">
      <div class="topic-tag" id="topic-tag">GRAMMAR CATEGORY</div>
      <h2 id="question-text">Loading question...</h2>
      
      <div id="options-grid" class="options-grid">
        <!-- Generado dinámicamente -->
      </div>

      <!-- FEEDBACK Y EXPLICACIÓN -->
      <div id="feedback-panel" class="hidden">
        <div id="feedback-status"></div>
        <div id="explanation-text"></div>
        <button id="next-btn" onclick="nextQuestion()">NEXT ROUND ➔</button>
      </div>
    </main>
  </div>

  <!-- Cargas de Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
