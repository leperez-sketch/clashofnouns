<!DOCTYPE html>
<html lang="es">
<head>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0b0c10;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top HUD / Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 25px;
      background: rgba(20, 22, 30, 0.95);
      border-bottom: 2px solid #1f2833;
      z-index: 10;
    }

    .team-hud {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 32%;
    }

    .team-hud.blue {
      flex-direction: row-reverse;
    }

    .team-name {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .red-text { color: #ff3366; text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
    .blue-text { color: #00d2ff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.5); }

    .hp-bar-outer {
      flex-grow: 1;
      height: 22px;
      background: #1a1a24;
      border-radius: 11px;
      overflow: hidden;
      border: 2px solid #333;
      position: relative;
    }

    .hp-bar-inner {
      height: 100%;
      width: 100%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .red-hp { background: linear-gradient(90deg, #ff3366, #ff6b81); }
    .blue-hp { background: linear-gradient(90deg, #0072ff, #00d2ff); }

    /* Center Controls & Timer */
    .center-hud {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .level-select {
      background: #181a26;
      color: #00d2ff;
      border: 2px solid #2e344d;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    .level-select:hover {
      border-color: #00d2ff;
    }

    .timer-box {
      border: 2px solid #ff3366;
      border-radius: 8px;
      padding: 4px 16px;
      background: #12131c;
      box-shadow: 0 0 12px rgba(255, 51, 102, 0.3);
    }

    .timer-text {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ff3366;
      font-family: monospace;
    }

    /* Battlefield Canvas */
    #battlefield {
      flex-grow: 1;
      width: 100%;
      background: radial-gradient(circle at center, #1a1c29 0%, #0d0e15 100%);
      display: block;
    }

    /* Bottom Control / Questions Section */
    .quiz-container {
      display: flex;
      height: 250px;
      border-top: 2px solid #222533;
      background: #0f1017;
      position: relative;
    }

    .quiz-side {
      flex: 1;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .quiz-side.red-side {
      border-right: 2px solid rgba(255, 255, 255, 0.1);
    }

    .quiz-header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .category-badge {
      background: #2a2d3d;
      color: #aaa;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .question-card {
      background: #181a26;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 1.1rem;
      font-weight: 600;
      min-height: 48px;
      display: flex;
      align-items: center;
      border: 1px solid #2a2d3d;
    }

    /* 2x2 Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .option-btn {
      background: #1e2235;
      border: 2px solid #2e344d;
      color: #fff;
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .option-btn:hover {
      transform: translateY(-2px);
    }

    .red-side .option-btn:hover { border-color: #ff3366; background: rgba(255, 51, 102, 0.15); }
    .blue-side .option-btn:hover { border-color: #00d2ff; background: rgba(0, 210, 255, 0.15); }

    /* Game Over Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .modal-content {
      background: #161824;
      border: 3px solid #333;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 420px;

      margin-top: 20px;

      background: #ff3366;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .restart-btn:hover {
      background: #e02452;
    }
  </style>

    // --- Canvas Engine Setup ---
    const canvas = document.getElementById("battlefield");
    const ctx = canvas.getContext("2d");
    let arrows = [];
    let particles = [];
    let floatingTexts = [];
    let screenShake = 0;

    function resizeCanvas() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Arrow Physics & Visuals ---
    class Arrow {
      constructor(startX, startY, targetX, targetY, color) {
        this.startX = startX;
        this.startY = startY;
        this.targetX = targetX;
        this.targetY = targetY;
        this.color = color;
        this.progress = 0;
        this.speed = 0.025 + Math.random() * 0.008;
        this.arcHeight = 60 + Math.random() * 80;
        
        this.x = startX;
        this.y = startY;
        this.prevX = startX;
        this.prevY = startY;
      }

      update() {
        this.prevX = this.x;
        this.prevY = this.y;
        this.progress += this.speed;

        // Curved Bezier Path
        const t = this.progress;
        this.x = (1 - t) * this.startX + t * this.targetX;
        const linearY = (1 - t) * this.startY + t * this.targetY;
        this.y = linearY - Math.sin(t * Math.PI) * this.arcHeight;

        return this.progress >= 1;
      }

      draw() {
        const dx = this.x - this.prevX;
        const dy = this.y - this.prevY;
        const angle = Math.atan2(dy, dx);

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(angle);

        // Arrow Shaft
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-15, 0);
        ctx.lineTo(10, 0);
        ctx.stroke();

        // Arrow Head
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.moveTo(10, -4);
        ctx.lineTo(16, 0);
        ctx.lineTo(10, 4);
        ctx.fill();

        ctx.restore();
      }
    }

    function createHitParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          life: 1.0,
          color
        });
      }
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, life: 1.0, color });
    }

    // --- Main Render Loop ---
    function animate() {
      ctx.save();

      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.85;
        if (screenShake < 0.5) screenShake = 0;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const midX = canvas.width / 2;
      const groundY = canvas.height - 30;

      // Center Divider Line
      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.setLineDash([8, 8]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(midX, 0);
      ctx.lineTo(midX, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Stickman Armies
      drawStickTeam(canvas.width * 0.15, groundY, 4, "#ff3366", true);
      drawStickTeam(canvas.width * 0.85, groundY, 4, "#00d2ff", false);

      // Render Arrows
      for (let i = arrows.length - 1; i >= 0; i--) {
        const arrow = arrows[i];
        const arrived = arrow.update();
        arrow.draw();

        if (arrived) {
          createHitParticles(arrow.targetX, arrow.targetY, arrow.color);
          addFloatingText(`-${DAMAGE_CORRECT} HP`, arrow.targetX, arrow.targetY - 10, arrow.color);
          screenShake = 6;
          arrows.splice(i, 1);
        }
      }

      // Render Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        if (p.life <= 0) particles.splice(i, 1);
      }

      // Render Combat Text
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 1;
        ft.life -= 0.02;
        ctx.fillStyle = ft.color;
        ctx.font = "bold 18px Segoe UI";
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.fillText(ft.text, ft.x - 25, ft.y);
        ctx.globalAlpha = 1.0;

        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(animate);
    }

    function drawStickTeam(startX, groundY, count, color, isFacingRight) {
      const spacing = 40;
      for (let i = 0; i < count; i++) {
        const x = isFacingRight ? startX - i * spacing : startX + i * spacing;
        const y = groundY;

        ctx.strokeStyle = color;
        ctx.lineWidth = (i === 0) ? 3.5 : 2.5; // Leader is thicker

        // Head
        ctx.beginPath();
        ctx.arc(x, y - 45, 8, 0, Math.PI * 2);
        ctx.stroke();

        // Body
        ctx.beginPath();
        ctx.moveTo(x, y - 37);
        ctx.lineTo(x, y - 18);
        ctx.stroke();

        // Legs
        ctx.beginPath();
        ctx.moveTo(x, y - 18);
        ctx.lineTo(x - 8, y);
        ctx.moveTo(x, y - 18);
        ctx.lineTo(x + 8, y);
        ctx.stroke();

        // Arms
        const armDir = isFacingRight ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(x, y - 30);
        ctx.lineTo(x + 10 * armDir, y - 25);
        ctx.stroke();
      }
    }

    // --- Gameplay Combat Actions ---
    function triggerAttack(attacker) {
      const isRed = attacker === 'red';
      const count = 5;

      // Volley of arrows
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const startX = isRed ? canvas.width * 0.15 : canvas.width * 0.85;
          const startY = canvas.height - 60 - Math.random() * 20;
          const targetX = isRed ? canvas.width * 0.85 : canvas.width * 0.15;
          const targetY = canvas.height - 40 - Math.random() * 20;
          const color = isRed ? '#ff3366' : '#00d2ff';

          arrows.push(new Arrow(startX, startY, targetX, targetY, color));
        }, i * 80);
      }

      // Apply Direct Damage to Opponent
      if (isRed) {
        blueHealth = Math.max(0, blueHealth - DAMAGE_CORRECT);
        document.getElementById("blue-hp").style.width = blueHealth + "%";
      } else {
        redHealth = Math.max(0, redHealth - DAMAGE_CORRECT);
        document.getElementById("red-hp").style.width = redHealth + "%";
      }

      checkWinCondition();
    }

    function triggerSelfPenalty(team) {
      const isRed = team === 'red';
      const selfX = isRed ? canvas.width * 0.15 : canvas.width * 0.85;
      const selfY = canvas.height - 50;

      // Show punishment particles & penalty floaters
      createHitParticles(selfX, selfY, "#ff0000");
      addFloatingText(`-${DAMAGE_WRONG} HP (MISSED!)`, selfX, selfY - 20, "#ff4d4d");
      screenShake = 8;

      if (isRed) {
        redHealth = Math.max(0, redHealth - DAMAGE_WRONG);
        document.getElementById("red-hp").style.width = redHealth + "%";
      } else {
        blueHealth = Math.max(0, blueHealth - DAMAGE_WRONG);
        document.getElementById("blue-hp").style.width = blueHealth + "%";
      }

      checkWinCondition();
    }

    // --- Quiz Engine ---
    function getRandomQuestion() {
      const db = QUESTIONS_DB[currentLevel] || QUESTIONS_DB["A1"];
      return db[Math.floor(Math.random() * db.length)];
    }

    function loadQuestion(team) {
      const q = getRandomQuestion();
      if (team === 'red') {
        currentRedQ = q;
        document.getElementById("red-cat").innerText = q.category;
        document.getElementById("red-q-text").innerText = q.question;
        const container = document.getElementById("red-options");
        container.innerHTML = "";
        q.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = opt;
          btn.onclick = () => answerQuestion('red', opt);
          container.appendChild(btn);
        });
      } else {
        currentBlueQ = q;
        document.getElementById("blue-cat").innerText = q.category;
        document.getElementById("blue-q-text").innerText = q.question;
        const container = document.getElementById("blue-options");
        container.innerHTML = "";
        q.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = opt;
          btn.onclick = () => answerQuestion('blue', opt);
          container.appendChild(btn);
        });
      }
    }

    function answerQuestion(team, selected) {
      const currentQ = team === 'red' ? currentRedQ : currentBlueQ;
      
      if (selected === currentQ.correct) {
        triggerAttack(team);
      } else {
        triggerSelfPenalty(team);
      }
      loadQuestion(team);
    }

    function changeLevel(newLevel) {
      currentLevel = newLevel;
      loadQuestion('red');
      loadQuestion('blue');
    }

    // --- Timer & Match Management ---
    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById("timer").innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

        if (timeRemaining <= 0) {
          endGame();
        }
      }, 1000);
    }

    function checkWinCondition() {
      if (redHealth <= 0 || blueHealth <= 0) {
        endGame();
      }
    }

    function endGame() {
      clearInterval(timerInterval);
      const modal = document.getElementById("game-over-modal");
      const title = document.getElementById("winner-text");

      if (redHealth > blueHealth) {
        title.innerText = "RED TEAM WINS!";
        title.className = "modal-title red-text";
      } else if (blueHealth > redHealth) {
        title.innerText = "BLUE TEAM WINS!";
        title.className = "modal-title blue-text";
      } else {
        title.innerText = "IT'S A DRAW!";
        title.className = "modal-title";
      }

      modal.style.display = "flex";
    }

    function resetGame() {
      redHealth = 100;
      blueHealth = 100;
      timeRemaining = 120;
      document.getElementById("red-hp").style.width = "100%";
      document.getElementById("blue-hp").style.width = "100%";
      document.getElementById("game-over-modal").style.display = "none";

      loadQuestion('red');
      loadQuestion('blue');
      clearInterval(timerInterval);
      startTimer();
    }

    // Initialize Game
    loadQuestion('red');
    loadQuestion('blue');
    startTimer();
    animate();
  </script>
</body>
</html>
